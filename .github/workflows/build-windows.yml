name: Build DJAR RVC Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install requests pyinstaller

      - name: Build portable folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "DJAR RVC Studio" app/main.py

      - name: Add launcher and readme
        shell: pwsh
        run: |
          Copy-Item README.md dist\"DJAR RVC Studio"\README.md -ErrorAction SilentlyContinue

      - name: Zip portable build
        shell: pwsh
        run: |
          Compress-Archive -Path dist\"DJAR RVC Studio" -DestinationPath DJAR-RVC-Studio-Portable.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DJAR-RVC-Studio-Portable
          path: DJAR-RVC-Studio-Portable.zip
