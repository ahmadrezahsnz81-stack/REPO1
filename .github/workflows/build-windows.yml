name: Build DJAR RVC Studio

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install build tools
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install requests numpy soundfile PySide6 pyinstaller

      - name: Build portable folder
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --name "DJAR RVC Studio" --collect-all PySide6 --collect-all numpy --collect-all soundfile --hidden-import requests app/launcher.py

      - name: Add README
        shell: pwsh
        run: |
          Copy-Item README.md 'dist\DJAR RVC Studio\README.md' -Force

      - name: Validate portable build
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist\DJAR RVC Studio\DJAR RVC Studio.exe')) { throw 'DJAR RVC Studio.exe was not created.' }
          Get-ChildItem 'dist\DJAR RVC Studio' -Recurse | Select-Object FullName,Length

      - name: Upload portable folder
        uses: actions/upload-artifact@v4
        with:
          name: DJAR-RVC-Studio-Portable-v3
          path: 'dist/DJAR RVC Studio'
          if-no-files-found: error
